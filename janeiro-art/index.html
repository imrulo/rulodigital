<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>janeiro.ai — organism</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #05080c;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      }
      main {
        width: min(100vw, 100vh);
        max-width: 800px;
        padding: 16px;
      }
      canvas {
        display: block;
        width: 100% !important;
        height: auto !important;
        border-radius: 8px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      }
      p {
        margin: 14px 4px 0;
        color: #8aa4b8;
        font-size: 13px;
        letter-spacing: 0.02em;
      }
      code {
        color: #9ec9d8;
      }
    </style>
  </head>
  <body>
    <main>
      <div id="stage"></div>
      <p>
        janeiro.ai organism · generative field inspired by
        <code>@yuruyurau</code> / #つぶやきProcessing
      </p>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
    <script src="./organism.js"></script>
  </body>
</html>
